{% extends 'base.html' %}
{% block content %}
<h2>Your Notifications</h2>

{% if notifications %}
  <ul>
    {% for n in notifications %}
      <li style="{% if not n.is_read %}font-weight:bold;{% endif %}">
        {{ n.message }} <small>{{ n.created_at }}</small>
        {% if not n.is_read %}
          <a href="{% url 'notifications:mark_as_read' n.id %}">Mark as read</a>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>No notifications yet.</p>
{% endif %}
{% endblock %}
