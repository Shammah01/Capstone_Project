{% extends 'base.html' %}
{% block title %}Login | MedConnect{% endblock %}
{% block content %}
<div class="col-md-6 offset-md-3 card shadow-sm p-4">
    <h3 class="text-center text-primary mb-3">Login to Your Account</h3>
    <form method="POST" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3">
        Don’t have an account? <a href="{% url 'register' %}">Register</a>
    </p>
</div>
{% endblock %}
