{% extends 'base.html' %}
{% block title %}Book Appointment | MedConnect{% endblock %}
{% block content %}
<div class="col-md-6 offset-md-3 card shadow-sm p-4">
    <h3 class="text-center text-success mb-3">Book an Appointment</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100">Confirm Appointment</button>
    </form>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mt-3 w-100">Back to Dashboard</a>
</div>
{% endblock %}
